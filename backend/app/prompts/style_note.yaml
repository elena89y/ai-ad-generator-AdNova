# 자유서술 스타일 → 영문 연출 절 번역 원장 (초안, 스냅샷 게이트 비편입) — 담당: 한의정.
#
# 정직성/함정 경계:
#  - 함정#1: 출력은 영어만 (CLIP/T5가 한글을 노이즈로 해석).
#  - 정체성 보존: 제품·음식 자체(형태·색·개수·가니시)를 바꾸거나 소품을 더/빼라는 지시 금지.
#    '소품 최소' 같은 요청은 '배경을 비우고 여백을 넓혀라'(scene minimalism)로 옮긴다 — 제품에서
#    무언가를 제거하라는 뜻으로 옮기지 않는다.
#  - 연출(조명·색감·분위기·배경 질감)만. 텍스트/글자 요청은 무시(타이포는 코드 담당).

translate:
  instruction: '사용자가 광고 이미지의 무드를 한글로 자유 서술했다. 이를 이미지 생성 모델용 "영문 연출 절"로 옮겨라.

    - 서술: ${note}

    규칙:

    1. 영어로만 출력. 조명·색감·분위기·배경 질감 등 연출 어휘만 사용한다.

    2. 제품/음식 자체의 구성(형태·색·개수·가니시·플레이팅)은 절대 바꾸지 마라. "소품 최소/미니멀" 류 요청은 "clean uncluttered background, generous negative space"처럼 배경·여백 어휘로 옮긴다 — 제품에서 무언가를 제거하라는 지시로 옮기지 마라. "remove/add props", "change composition", 재료 변형 지시는 넣지 마라.

    3. 12단어 이내로 간결하게. 이미지에 글자/텍스트를 넣으라는 요청은 무시한다.

    4. 서술이 비었거나 연출로 옮길 게 없으면 빈 문자열.

    반드시 JSON: {"style_en":"warm golden-hour light, airy negative space, soft muted tones"}'
