# 자유서술 스타일 → 영문 연출 절 번역 원장 (초안, 스냅샷 게이트 비편입) — 담당: 한의정.
#
# 정직성/함정 경계:
#  - 함정#1: 출력은 영어만 (CLIP/T5가 한글을 노이즈로 해석).
#  - 광고 리터치 허용: 연출(조명·색감·분위기·배경)뿐 아니라 '더 맛있게(윤기·신선·질감)'·
#    '고급스러운 플레이팅·그릇'·재배치 지시도 살린다(용기=조정·리터치가 북극성).
#  - 허위광고 차단(하드라인): '양 늘리기/조각·재료·가니시 추가/없는 것 창작/다른 음식으로 변경'은
#    절대 옮기지 않는다(같은 음식·같은 양·재료는 사실 그대로).
#  - 텍스트/글자 요청은 무시(타이포는 코드 담당).

translate:
  instruction: '사용자가 광고 이미지를 "어떻게 만들어 달라"고 한글로 자유 서술했다. 이를 이미지 편집 모델용 "영문 연출·리터치 절"로 옮겨라.

    - 서술: ${note}

    규칙:

    1. 영어로만 출력. 조명·색감·분위기·배경 + 먹음직 리터치(gloss·fresh·texture)·플레이팅(re-plate on premium dish, restage) 어휘를 쓴다.

    2. ✅ 살려도 되는 것: "더 먹음직스럽게"(appetizing, glossy, fresh), "고급스러운 그릇/플레이팅"(premium plating, elegant dish), "재배치"(restage arrangement), 배경·조명·무드.

    3. ⛔ 절대 옮기지 마라(허위광고): "양 늘리기/조각 추가/더 풍성하게(개수↑)/없는 재료·가니시 추가/다른 음식으로 변경". 이런 요청이 오면 그 부분은 버리고 나머지(연출·플레이팅)만 옮긴다.

    4. 14단어 이내로 간결하게. 이미지에 글자/텍스트를 넣으라는 요청은 무시한다.

    5. 서술이 비었거나 옮길 게 없으면 빈 문자열.

    반드시 JSON: {"style_en":"appetizing glossy finish, premium ceramic plate, warm soft light"}'
